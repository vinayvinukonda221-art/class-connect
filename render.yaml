        value: "Vignan's Foundation for Science, Technology and Research (VFSTR)"
      - key: DEPARTMENT_NAME
        value: "Computer Science and Engineering"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
